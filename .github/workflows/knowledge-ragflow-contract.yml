name: Knowledge RAGFlow Contract

# Live integration checks against a real RAGFlow instance.
# Unit CI (knowledge-ci.yml) does NOT require RAGFlow secrets.

on:
  workflow_dispatch:
    inputs:
      ragflow_base_url:
        description: "RAGFlow base URL (RAGFlow 服务地址)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"

jobs:
  ragflow-contract:
    name: Live RAGFlow contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when RAGFLOW_API_KEY missing
        if: ${{ secrets.RAGFLOW_API_KEY == '' }}
        run: |
          echo "skipped_no_secret: RAGFLOW_API_KEY not configured; live contract tests skipped."

      - name: Setup Python
        if: ${{ secrets.RAGFLOW_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ secrets.RAGFLOW_API_KEY != '' }}
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        if: ${{ secrets.RAGFLOW_API_KEY != '' }}
        working-directory: nodeskclaw-knowledge
        run: uv sync

      - name: Run live contract tests
        if: ${{ secrets.RAGFLOW_API_KEY != '' }}
        working-directory: nodeskclaw-knowledge
        env:
          RAGFLOW_CONTRACT_TEST: "1"
          RAGFLOW_API_KEY: ${{ secrets.RAGFLOW_API_KEY }}
          RAGFLOW_BASE_URL: ${{ inputs.ragflow_base_url != '' && inputs.ragflow_base_url || secrets.RAGFLOW_BASE_URL }}
          RAGFLOW_CONTRACT_DATASET_ID: ${{ secrets.RAGFLOW_CONTRACT_DATASET_ID }}
        run: uv run pytest tests/ragflow_contract -m ragflow_contract -q
