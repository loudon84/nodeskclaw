          title: Message Key
        message:
          type: string
          title: Message
        data:
          type: 'null'
          title: Data
        message_params:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Message Params
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - error_code
      - message_key
      - message
      title: ApiErrorBody
    ApiResponse_ArtifactPreviewData_:
      properties:
