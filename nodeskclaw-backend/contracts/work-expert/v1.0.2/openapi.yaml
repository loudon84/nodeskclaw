  /api/v1/hermes/tasks/{task_id}/events:
    get:
      tags:
      - Hermes Skill
      summary: Stream Task Events
      operationId: stream_task_events_api_v1_hermes_tasks__task_id__events_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: last_event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Event Id
      responses:
        '200':
          description: text/event-stream of TaskEventEnvelope frames; id={task_id}-{event_seq}
          content:
            text/event-stream:
              schema:
                properties:
                  event:
                    title: Event
                    type: string
                  task_id:
                    title: Task Id
                    type: string
                  timestamp:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Timestamp
                  event_type:
                    title: Event Type
                    type: string
                  event_seq:
                    title: Event Seq
                    type: integer
                required:
                - event
                - task_id
                - event_type
                - event_seq
                title: TaskEventEnvelope
                type: object
        '400':
          description: Bad request or invalid task state, e.g. errors.task.cannot_cancel
            / errors.task.cannot_retry
          content:
            application/json:
              schema:
