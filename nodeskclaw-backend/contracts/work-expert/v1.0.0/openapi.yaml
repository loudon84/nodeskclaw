components:
  schemas:
    AcceptInviteRequest:
      properties:
        token:
          type: string
          title: Token
        name:
          type: string
          title: Name
        password:
          type: string
          title: Password
      type: object
      required:
      - token
      - name
      - password
      title: AcceptInviteRequest
    AccountLoginRequest:
      properties:
        account:
          type: string
          maxLength: 200
          minLength: 1
          title: Account
        password:
          type: string
          maxLength: 200
          minLength: 1
          title: Password
      type: object
      required:
      - account
      - password
      title: AccountLoginRequest
    AddAgentRequest:
      properties:
        instance_id:
          type: string
          title: Instance Id
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        hex_q:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hex Q
        hex_r:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hex R
        install_gene_slugs:
          items:
            type: string
          type: array
          title: Install Gene Slugs
          default: []
      type: object
      required:
      - instance_id
      title: AddAgentRequest
    AdminGeneHubSkillCreate:
      properties:
        name:
          type: string
          maxLength: 128
          title: Name
        slug:
          type: string
          maxLength: 128
          title: Slug
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        short_description:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Short Description
        category:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Category
        tags:
          items:
            type: string
          type: array
          title: Tags
          default: []
        version:
          type: string
          maxLength: 32
          title: Version
          default: 1.0.0
        skill_content:
          type: string
          minLength: 1
          title: Skill Content
        scripts:
          additionalProperties:
            type: string
          type: object
          title: Scripts
          default: {}
        compatibility:
          items:
            $ref: '#/components/schemas/CompatibilityItem'
          type: array
          title: Compatibility
        visibility:
          type: string
          title: Visibility
          default: org_private
        is_published:
          type: boolean
          title: Is Published
          default: false
      type: object
      required:
      - name
      - slug
      - skill_content
      - compatibility
      title: AdminGeneHubSkillCreate
    AdminGeneHubSkillInfo:
      properties:
        id:
          type: string
          title: Id
        slug:
          type: string
          title: Slug
        version:
          type: string
          title: Version
        review_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Review Status
        is_published:
          type: boolean
          title: Is Published
          default: false
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - id
      - slug
      - version
      title: AdminGeneHubSkillInfo
    AdminGeneHubSkillReview:
      properties:
        action:
          type: string
          pattern: ^(approve|reject)$
          title: Action
        reason:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Reason
      type: object
      required:
      - action
      title: AdminGeneHubSkillReview
    AdminGeneHubSkillUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        short_description:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Short Description
        category:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Category
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        version:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Version
        skill_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Content
        scripts:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Scripts
        compatibility:
          anyOf:
          - items:
              $ref: '#/components/schemas/CompatibilityItem'
            type: array
          - type: 'null'
          title: Compatibility
        visibility:
          anyOf:
          - type: string
          - type: 'null'
          title: Visibility
      type: object
      title: AdminGeneHubSkillUpdate
    AdminInstallJobAssign:
      properties:
        gene_slug:
          type: string
          maxLength: 128
          title: Gene Slug
        version:
          type: string
          title: Version
          default: latest
        target_type:
          type: string
          pattern: ^(organization|user|role|department)$
          title: Target Type
        target_ids:
          items:
            type: string
          type: array
          title: Target Ids
        profile_name:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Profile Name
        job_type:
          type: string
          pattern: ^(install|update|uninstall|rollback)$
          title: Job Type
          default: install
      type: object
      required:
      - gene_slug
      - target_type
      - target_ids
      title: AdminInstallJobAssign
    AdminInstallJobAssignResult:
      properties:
        created:
          type: integer
          title: Created
        skipped:
          type: integer
          title: Skipped
        jobs:
          items:
            $ref: '#/components/schemas/AdminInstallJobInfo'
          type: array
          title: Jobs
      type: object
      required:
      - created
      - skipped
      - jobs
      title: AdminInstallJobAssignResult
    AdminInstallJobInfo:
      properties:
        id:
          type: string
          title: Id
        user_id:
          type: string
          title: User Id
        status:
          type: string
          title: Status
        gene_slug:
          type: string
          title: Gene Slug
        gene_version:
          type: string
          title: Gene Version
        job_type:
          type: string
          title: Job Type
        install_mode:
          type: string
          title: Install Mode
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Id
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - user_id
      - status
      - gene_slug
      - gene_version
      - job_type
      - install_mode
      title: AdminInstallJobInfo
    AgentBundleImportRequest:
      properties:
        bundle_path:
          type: string
          title: Bundle Path
        name:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Name
        slug:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Slug
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        short_description:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Short Description
        icon:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Icon
      type: object
      required:
      - bundle_path
      title: AgentBundleImportRequest
    ApiResponse:
      properties:
        code:
          type: integer
          title: Code
          default: 0
        error_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Error Code
        message_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Key
        message:
          type: string
          title: Message
          default: success
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
      type: object
      title: ApiResponse
      description: Unified API response wrapper.
