x-knowledge-environment: &knowledge-environment
  DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgresql+asyncpg://nodeskclaw:nodeskclaw@postgres:5432/nodeskclaw_knowledge}
  KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
  RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://host.docker.internal:9380}
  RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
  KNOWLEDGE_UPLOAD_MAX_MB: ${KNOWLEDGE_UPLOAD_MAX_MB:-200}
  KNOWLEDGE_API_V2_ENABLED: ${KNOWLEDGE_API_V2_ENABLED:-true}
  KNOWLEDGE_V2_RUNTIME_BINDING_ENABLED: ${KNOWLEDGE_V2_RUNTIME_BINDING_ENABLED:-true}
  KNOWLEDGE_V2_BUILD_ENABLED: ${KNOWLEDGE_V2_BUILD_ENABLED:-false}
  KNOWLEDGE_V2_APPLICATION_ENABLED: ${KNOWLEDGE_V2_APPLICATION_ENABLED:-false}
  KNOWLEDGE_V2_GRAPH_RUNTIME_ENABLED: ${KNOWLEDGE_V2_GRAPH_RUNTIME_ENABLED:-false}
  KNOWLEDGE_V2_SUMMARY_RUNTIME_ENABLED: ${KNOWLEDGE_V2_SUMMARY_RUNTIME_ENABLED:-false}
  KNOWLEDGE_V2_TOC_ENHANCE_ENABLED: ${KNOWLEDGE_V2_TOC_ENHANCE_ENABLED:-false}
  RAGFLOW_BUILD_BATCH_SIZE: ${RAGFLOW_BUILD_BATCH_SIZE:-50}
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodeskclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodeskclaw}
      POSTGRES_DB: ${POSTGRES_DB:-nodeskclaw}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodeskclaw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nodeskclaw-backend:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-backend:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-agent:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${NODESKCLAW_DATA_DIR:-${HOME:-.}/.nodeskclaw/docker-instances}
        target: /nodeskclaw-data
      - type: bind
        source: .
        target: /host-config
        read_only: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nodeskclaw:nodeskclaw@postgres:5432/nodeskclaw}
      DATABASE_NAME_SUFFIX: ""
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://localhost:${LLM_PROXY_PORT:-4511}}
      LLM_PROXY_INTERNAL_URL: http://llm-proxy:8080
      LLM_ATTRIBUTION_SECRET: ${LLM_ATTRIBUTION_SECRET:-}
      NODESKCLAW_EDITION: ce
      DOCKER_DATA_DIR: /nodeskclaw-data
      DOCKER_HOST_DATA_DIR: ${NODESKCLAW_DATA_DIR:-${HOME:-.}/.nodeskclaw/docker-instances}
      # AI 员工回连后端地址（仅管理 Docker 实例时可保持默认 localhost）
      # 若管理远端 K8s 集群上的 AI 员工，必须改为 K8s Pod 可达的外部地址
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-http://localhost:4510/api/v1}
      AGENT_FILE_DOWNLOAD_BASE_URL: ${AGENT_FILE_DOWNLOAD_BASE_URL:-}
      SKILL_AGENT_BASE_URL: ${SKILL_AGENT_BASE_URL:-http://nodeskclaw-agent:4520}
      SKILL_AGENT_INTERNAL_TOKEN: ${SKILL_AGENT_INTERNAL_TOKEN:-change-me-skill-agent-token}
      SKILL_AGENT_ENABLED: ${SKILL_AGENT_ENABLED:-true}
      UPLOAD_STORAGE_BACKEND: ${UPLOAD_STORAGE_BACKEND:-auto}
      UPLOAD_GATEWAY_PROXY_BODY_SIZE_MB: ${UPLOAD_GATEWAY_PROXY_BODY_SIZE_MB:-50}
      UPLOAD_PROXY_READ_TIMEOUT_SECONDS: ${UPLOAD_PROXY_READ_TIMEOUT_SECONDS:-300}
      UPLOAD_PROXY_SEND_TIMEOUT_SECONDS: ${UPLOAD_PROXY_SEND_TIMEOUT_SECONDS:-300}
      UPLOAD_CHAT_ATTACHMENT_MAX_MB: ${UPLOAD_CHAT_ATTACHMENT_MAX_MB:-20}
      UPLOAD_SHARED_FILE_MAX_MB: ${UPLOAD_SHARED_FILE_MAX_MB:-200}
      UPLOAD_CHUNKED_UPLOAD_THRESHOLD_MB: ${UPLOAD_CHUNKED_UPLOAD_THRESHOLD_MB:-50}
      UPLOAD_WORKSPACE_QUOTA_MB: ${UPLOAD_WORKSPACE_QUOTA_MB:-10240}
      UPLOAD_SECURITY_SCAN_MODE: ${UPLOAD_SECURITY_SCAN_MODE:-metadata_only}
      DEBUG: ${DEBUG:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-bytes-base64-key__=}
      INIT_ADMIN_ACCOUNT: ${INIT_ADMIN_ACCOUNT:-admin}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-4510}:8000"
    restart: unless-stopped

  nodeskclaw-agent:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-agent:${DESKCLAW_VERSION:-latest}
    build:
      context: .
      dockerfile: nodeskclaw-agent/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nodeskclaw:nodeskclaw@postgres:5432/nodeskclaw}
      SKILL_AGENT_INTERNAL_TOKEN: ${SKILL_AGENT_INTERNAL_TOKEN:-change-me-skill-agent-token}
      SKILL_AGENT_WORKER_ENABLED: ${SKILL_AGENT_WORKER_ENABLED:-true}
      SKILL_AGENT_SCHEMA: agent
      SKILL_AGENT_ROLE: ${SKILL_AGENT_ROLE:-central}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SKILL_AGENT_PORT:-4520}:4520"
    restart: unless-stopped

  llm-proxy:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-llm-proxy:${DESKCLAW_VERSION}
    build:
      context: nodeskclaw-llm-proxy
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${CODEX_HOME_DIR:-$HOME/.codex}:/root/.codex
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nodeskclaw:nodeskclaw@postgres:5432/nodeskclaw}
      LLM_ATTRIBUTION_SECRET: ${LLM_ATTRIBUTION_SECRET:-}
      CODEX_HOME: /root/.codex
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LLM_PROXY_PORT:-4511}:8080"
    restart: unless-stopped

  nodeskclaw-knowledge:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-knowledge:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-knowledge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-backend:
        condition: service_started
      llm-proxy:
        condition: service_started
    environment:
      <<: *knowledge-environment
      LLM_PROXY_URL: http://llm-proxy:8080
      NODESKCLAW_BACKEND_URL: http://nodeskclaw-backend:8000
    ports:
      - "${KNOWLEDGE_PORT:-4530}:4530"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4530/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  nodeskclaw-knowledge-ingestion-worker:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-knowledge:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-knowledge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-knowledge:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.workers.ingestion_worker"]
    environment:
      <<: *knowledge-environment
      NODESKCLAW_BACKEND_URL: http://nodeskclaw-backend:8000
    restart: unless-stopped

  nodeskclaw-knowledge-build-worker:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-knowledge:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-knowledge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-knowledge:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.workers.build_worker"]
    environment:
      <<: *knowledge-environment
      KNOWLEDGE_V2_BUILD_ENABLED: ${KNOWLEDGE_V2_BUILD_ENABLED:-true}
    restart: unless-stopped

  nodeskclaw-knowledge-maintenance-worker:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-knowledge:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-knowledge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-knowledge:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.workers.maintenance_worker",
        "--with-reconciliation",
      ]
    environment:
      <<: *knowledge-environment
      NODESKCLAW_BACKEND_URL: http://nodeskclaw-backend:8000
    restart: unless-stopped

  nodeskclaw-knowledge-connector-worker:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-knowledge:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-knowledge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-knowledge:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.workers.connector_worker"]
    environment:
      <<: *knowledge-environment
      NODESKCLAW_BACKEND_URL: http://nodeskclaw-backend:8000
    restart: unless-stopped

  nodeskclaw-knowledge-translation-worker:
    profiles: ["translation"]
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-knowledge:${DESKCLAW_VERSION}
    build:
      context: .
      dockerfile: nodeskclaw-knowledge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      nodeskclaw-knowledge:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.workers.translation_worker"]
    environment:
      <<: *knowledge-environment
      KNOWLEDGE_TRANSLATION_ENABLED: ${KNOWLEDGE_TRANSLATION_ENABLED:-true}
    restart: unless-stopped

  portal:
    image: nodesk-center-cn-beijing.cr.volces.com/public/nodeskclaw-portal:${DESKCLAW_VERSION}
    build:
      context: nodeskclaw-portal
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    depends_on:
      - nodeskclaw-backend
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PORTAL_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pg_data:
