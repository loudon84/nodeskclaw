[project]
name = "hermes-output-artifacts"
version = "0.3.0"
description = "Hermes plugin that publishes run artifacts to MinIO through the native run finalizer contract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.entry-points."hermes_agent.plugins"]
output_artifacts = "hermes_output_artifacts.plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_output_artifacts*"]
