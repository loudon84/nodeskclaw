openapi: 3.1.0
info:
  title: NodeSKClaw Knowledge Frontend Contract
  version: 1.0.0
  description: Curated frontend-facing API surface. Contract version is independent from HTTP /api/v1 and /api/v2 path versions.
servers:
  -
    url: "{knowledgeBaseUrl}"
    variables:
      knowledgeBaseUrl:
        default: "http://127.0.0.1:4530"
security:
  -
    bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiResponse:
      title: ApiResponse
      type: object
      properties:
        code:
          type: integer
        error_code:
          type:
            - integer
            - "null"
        message_key:
          type:
            - string
            - "null"
        message:
          type: string
        data: true
        details:
          type: object
        message_params:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      required:
        - code
        - message
        - data
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        code:
          type: integer
          minimum: 40000
        error_code:
          type: integer
          minimum: 40000
        message_key:
          type: string
        message:
          type: string
        data:
          type: "null"
        details:
          type: object
        message_params:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      required:
        - code
        - error_code
        - message_key
        - message
        - data
    PageData:
      title: PageData
      type: object
      properties:
        items:
          type: array
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
    HealthReady:
      title: HealthReady
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - not_ready
        checks:
          type: object
          properties:
            database:
              type: boolean
            ragflow:
              type: boolean
            backend:
              type: boolean
          additionalProperties: false
          required:
            - database
            - ragflow
            - backend
      additionalProperties: false
      required:
        - status
        - checks
    KnowledgeBase:
      title: KnowledgeBase
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        embedding_model:
          type: string
        chunk_method:
          type: string
        status:
          type: string
          enum:
            - provisioning
            - active
            - updating
            - degraded
            - error
            - deleting
        owner_member_id:
          type: string
        acl_version:
          type: integer
        visibility:
          type: string
          enum:
            - private
            - department
            - organization
        tags:
          type:
            - array
            - "null"
          items:
            type: string
        active_build_profile_id:
          type:
            - string
            - "null"
        knowledge_model_id:
          type:
            - string
            - "null"
        build_version:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
        - id
        - org_id
        - name
        - embedding_model
        - chunk_method
        - status
        - owner_member_id
        - acl_version
        - visibility
        - build_version
    KnowledgeBaseCreate:
      title: KnowledgeBaseCreate
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
            - string
            - "null"
        embedding_model:
          type: string
        chunk_method:
          type: string
        parser_config:
          type:
            - object
            - "null"
        visibility:
          type: string
          enum:
            - private
            - department
            - organization
        tags:
          type:
            - array
            - "null"
          items:
            type: string
      additionalProperties: false
      required:
        - name
    KnowledgeBaseUpdate:
      title: KnowledgeBaseUpdate
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
            - string
            - "null"
        tags:
          type:
            - array
            - "null"
          items:
            type: string
        visibility:
          type: string
          enum:
            - private
            - department
            - organization
      additionalProperties: false
    KnowledgeSet:
      title: KnowledgeSet
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        owner_member_id:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        acl_version:
          type: integer
        visibility:
          type: string
          enum:
            - private
            - department
            - organization
        retrieval_config:
          type:
            - object
            - "null"
        usage_count:
          type: integer
        last_used_at: true
        knowledge_bases:
          type:
            - array
            - "null"
          items:
            type: object
            properties:
              knowledge_base_id:
                type: string
              name:
                type: string
              weight:
                type: number
            additionalProperties: false
            required:
              - knowledge_base_id
      additionalProperties: false
      required:
        - id
        - org_id
        - name
        - owner_member_id
        - status
        - acl_version
        - visibility
        - usage_count
    KnowledgeSetCreate:
      title: KnowledgeSetCreate
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
            - string
            - "null"
        visibility:
          type: string
          enum:
            - private
            - department
            - organization
        retrieval_config:
          type:
            - object
            - "null"
      additionalProperties: false
      required:
        - name
    KnowledgeSetUpdate:
      title: KnowledgeSetUpdate
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - active
            - disabled
        visibility:
          type: string
          enum:
            - private
            - department
            - organization
        retrieval_config:
          type:
            - object
            - "null"
      additionalProperties: false
    KnowledgeSetBind:
      title: KnowledgeSetBind
      type: object
      properties:
        knowledge_base_id:
          type: string
        weight:
          type: number
        sort_order:
          type: integer
      additionalProperties: false
      required:
        - knowledge_base_id
    SourceFile:
      title: SourceFile
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        knowledge_base_id:
          type: string
        file_name:
          type: string
        mime_type:
          type:
            - string
            - "null"
        owner_member_id:
          type: string
        active_version_id:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - pending
            - active
            - updating
            - error
            - deleting
        acl_version:
          type: integer
        last_error:
          type:
            - string
            - "null"
        metadata:
          type: object
        metadata_revision:
          type: integer
        archived_at: true
        parse_status:
          type:
            - string
            - "null"
        chunk_count:
          type:
            - integer
            - "null"
        version_no:
          type:
            - integer
            - "null"
        source_kind:
          type: string
          enum:
            - manual
            - connector
        connector_id:
          type:
            - string
            - "null"
        external_object_id:
          type:
            - string
            - "null"
        source_uri:
          type:
            - string
            - "null"
        source_path:
          type:
            - string
            - "null"
        source_revision:
          type:
            - string
            - "null"
        source_etag:
          type:
            - string
            - "null"
        source_modified_at: true
        source_metadata:
          type: object
        last_synced_at: true
        sync_state:
          type:
            - string
            - "null"
        archive_reason:
          type:
            - string
            - "null"
      additionalProperties: false
      required:
        - id
        - org_id
        - knowledge_base_id
        - file_name
        - owner_member_id
        - status
        - acl_version
    SourceFileVersion:
      title: SourceFileVersion
      type: object
      properties:
        id:
          type: string
        source_file_id:
          type: string
        version_no:
          type: integer
        file_size:
          type:
            - integer
            - "null"
        sha256:
          type:
            - string
            - "null"
        parse_status:
          type: string
          enum:
            - pending
            - parsing
            - active
            - failed
            - superseded
        chunk_count:
          type:
            - integer
            - "null"
        token_count:
          type:
            - integer
            - "null"
        uploaded_by_member_id:
          type:
            - string
            - "null"
        activated_at: true
        superseded_at: true
        created_at: true
      additionalProperties: false
      required:
        - id
        - source_file_id
        - version_no
        - parse_status
    IngestionJob:
      title: IngestionJob
      type: object
      properties:
        id:
          type: string
        source_file_id:
          type: string
        file_version_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - uploading
            - upload_unknown
            - ragflow_uploaded
            - metadata_synced
            - parse_dispatched
            - parsing
            - validating
            - active
            - failed
            - cancelled
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error_code:
          type:
            - string
            - "null"
        error_message:
          type:
            - string
            - "null"
        attempt_count:
          type: integer
        max_attempts:
          type: integer
        next_run_at: true
        finished_at: true
        created_by_member_id:
          type:
            - string
            - "null"
      additionalProperties: false
      required:
        - id
        - source_file_id
        - file_version_id
        - status
        - progress
        - attempt_count
        - max_attempts
    UploadAccepted:
      title: UploadAccepted
      type: object
      properties:
        source_file:
          $ref: "#/components/schemas/SourceFile"
        file_version_id:
          type: string
        job:
          $ref: "#/components/schemas/IngestionJob"
      additionalProperties: false
      required:
        - source_file
        - file_version_id
        - job
    IndexStateMap:
      title: IndexStateMap
      type: object
      additionalProperties:
        type: object
        properties:
          build_status:
            type: string
            enum:
              - not_built
              - building
              - ready
              - stale
              - failed
              - unsupported
          retrieval_status:
            type: string
            enum:
              - unavailable
              - ready
              - degraded
              - unsupported
          last_error:
            type: string
          validation:
            type: object
          coverage:
            type: object
          last_validated_at:
            type: string
          runtime_feature: true
        additionalProperties: false
        required:
          - build_status
          - retrieval_status
    BuildJob:
      title: BuildJob
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        knowledge_base_id:
          type:
            - string
            - "null"
        build_profile_id:
          type:
            - string
            - "null"
        index_type:
          type:
            - string
            - "null"
        trigger_reason:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - partial
            - failed
            - cancelled
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error_code:
          type:
            - string
            - "null"
        error_message:
          type:
            - string
            - "null"
        attempt_count:
          type: integer
        finished_at: true
        created_at: true
      additionalProperties: false
      required:
        - id
        - org_id
        - status
        - progress
        - attempt_count
    BuildJobList:
      title: BuildJobList
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/BuildJob"
      additionalProperties: false
      required:
        - jobs
    BuildProfile:
      title: BuildProfile
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        system_key:
          type:
            - string
            - "null"
        is_system:
          type: boolean
        index_types:
          type: array
          items:
            type: string
        artifact_types:
          type: array
          items:
            type: string
        trigger_policy:
          type: object
        artifact_trigger_policy:
          type: object
        version:
          type: integer
      additionalProperties: false
      required:
        - id
        - name
    BuildProfileView:
      title: BuildProfileView
      type: object
      properties:
        active_build_profile_id:
          type:
            - string
            - "null"
        resolved_profile:
          $ref: "#/components/schemas/BuildProfile"
      additionalProperties: false
      required:
        - resolved_profile
    BuildProfileUpdate:
      title: BuildProfileUpdate
      type: object
      properties:
        build_profile_id:
          type: string
          minLength: 1
      additionalProperties: false
      required:
        - build_profile_id
    TriggerBuildsRequest:
      title: TriggerBuildsRequest
      type: object
      properties:
        index_types:
          type: array
          items:
            type: string
          minItems: 1
        force:
          type: boolean
      additionalProperties: false
      required:
        - index_types
    Acl:
      title: Acl
      type: object
      properties:
        id:
          type: string
        subject_type:
          type: string
          enum:
            - member
            - role
            - department
            - organization
        subject_id:
          type: string
        permission:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        created_by_member_id:
          type: string
      additionalProperties: false
      required:
        - id
        - subject_type
        - subject_id
        - permission
        - effect
        - created_by_member_id
    AclCreate:
      title: AclCreate
      type: object
      properties:
        subject_type:
          type: string
          enum:
            - member
            - role
            - department
            - organization
        subject_id:
          type: string
          minLength: 1
        permission:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        role:
          type: string
      additionalProperties: false
      required:
        - subject_type
        - subject_id
    MetadataSchema:
      title: MetadataSchema
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
      additionalProperties: false
      required:
        - fields
    RetrievalProfile:
      title: RetrievalProfile
      type: object
      properties:
        id:
          type: string
        knowledge_set_id:
          type: string
        version:
          type: integer
        config:
          type: object
        status:
          type: string
          enum:
            - draft
            - active
            - archived
        created_by_member_id:
          type: string
        activated_at: true
        created_at: true
        updated_at: true
      additionalProperties: false
      required:
        - id
        - knowledge_set_id
        - version
        - config
        - status
        - created_by_member_id
    RetrievalProfileCreate:
      title: RetrievalProfileCreate
      type: object
      properties:
        config:
          type:
            - object
            - "null"
      additionalProperties: false
    RetrievalProfileUpdate:
      title: RetrievalProfileUpdate
      type: object
      properties:
        config:
          type: object
      additionalProperties: false
      required:
        - config
    RetrievalProfileRollback:
      title: RetrievalProfileRollback
      type: object
      properties:
        publish:
          type: boolean
      additionalProperties: false
    KnowledgeApplication:
      title: KnowledgeApplication
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        owner_member_id:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - disabled
        answer_model:
          type:
            - string
            - "null"
        active_profile_id:
          type:
            - string
            - "null"
        acl_version:
          type: integer
        visibility:
          type: string
        knowledge_set_ids:
          type: array
          items:
            type: string
        validation_job_id:
          type:
            - string
            - "null"
      additionalProperties: false
      required:
        - id
        - org_id
        - name
        - owner_member_id
        - status
        - acl_version
        - visibility
        - knowledge_set_ids
    KnowledgeApplicationCreate:
      title: KnowledgeApplicationCreate
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
            - string
            - "null"
        answer_model:
          type:
            - string
            - "null"
        knowledge_set_ids:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
        - name
    KnowledgeApplicationUpdate:
      title: KnowledgeApplicationUpdate
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
            - string
            - "null"
        answer_model:
          type:
            - string
            - "null"
      additionalProperties: false
    KnowledgeApplicationBindSet:
      title: KnowledgeApplicationBindSet
      type: object
      properties:
        knowledge_set_id:
          type: string
        sort_order:
          type: integer
      additionalProperties: false
      required:
        - knowledge_set_id
    KnowledgeApplicationPublish:
      title: KnowledgeApplicationPublish
      type: object
      properties:
        promote_on_validated:
          type: boolean
      additionalProperties: false
    ApplicationReadiness:
      title: ApplicationReadiness
      type: object
      properties:
        ready:
          type: boolean
        blocking:
          type: array
        warnings:
          type: array
      additionalProperties: true
    KnowledgeRelease:
      title: KnowledgeRelease
      type: object
      properties:
        id:
          type: string
        application_id:
          type: string
        version:
          type: integer
        status:
          type: string
          enum:
            - draft
            - validating
            - validated
            - promoted
            - superseded
            - retired
            - failed
        release_manifest:
          type: object
        manifest_hash:
          type:
            - string
            - "null"
        quality_snapshot_id:
          type:
            - string
            - "null"
        validation_job_id:
          type:
            - string
            - "null"
        created_by_member_id:
          type: string
        promoted_at: true
        retired_at: true
        validation_error:
          type:
            - string
            - "null"
        created_at: true
      additionalProperties: false
      required:
        - id
        - application_id
        - version
        - status
        - release_manifest
        - created_by_member_id
    KnowledgeReleaseCreate:
      title: KnowledgeReleaseCreate
      type: object
      properties:
        retrieval_policy_revision_id:
          type:
            - string
            - "null"
      additionalProperties: false
    ReleaseChannelState:
      title: ReleaseChannelState
      type: object
      properties:
        id:
          type: string
        application_id:
          type: string
        channel:
          type: string
          enum:
            - preview
            - stable
        active_release_id:
          type:
            - string
            - "null"
        traffic_policy:
          type:
            - object
            - "null"
        updated_by_member_id:
          type:
            - string
            - "null"
        updated_at: true
      additionalProperties: false
      required:
        - id
        - application_id
        - channel
    ReleasePromote:
      title: ReleasePromote
      type: object
      properties:
        release_id:
          type: string
      additionalProperties: false
      required:
        - release_id
    RetrievalPolicyRevision:
      title: RetrievalPolicyRevision
      type: object
      properties:
        id:
          type: string
        application_id:
          type: string
        revision_number:
          type: integer
        status:
          type: string
          enum:
            - draft
            - active
            - archived
        query_intelligence_policy:
          type:
            - object
            - "null"
        provider_policy:
          type:
            - object
            - "null"
        provider_weights:
          type:
            - object
            - "null"
        candidate_budget:
          type:
            - object
            - "null"
        fanout_budget:
          type:
            - object
            - "null"
        latency_budget:
          type:
            - object
            - "null"
        fallback_policy:
          type:
            - object
            - "null"
        artifact_policy:
          type:
            - object
            - "null"
        fusion_policy:
          type:
            - object
            - "null"
        created_by_member_id:
          type: string
        published_at: true
        notes:
          type:
            - string
            - "null"
        created_at: true
      additionalProperties: false
      required:
        - id
        - application_id
        - revision_number
        - status
        - created_by_member_id
    RetrievalPolicyRevisionCreate:
      title: RetrievalPolicyRevisionCreate
      type: object
      properties:
        query_intelligence_policy:
          type:
            - object
            - "null"
        provider_policy:
          type:
            - object
            - "null"
        provider_weights:
          type:
            - object
            - "null"
        candidate_budget:
          type:
            - object
            - "null"
        fanout_budget:
          type:
            - object
            - "null"
        latency_budget:
          type:
            - object
            - "null"
        fallback_policy:
          type:
            - object
            - "null"
        artifact_policy:
          type:
            - object
            - "null"
        fusion_policy:
          type:
            - object
            - "null"
        notes:
          type:
            - string
            - "null"
      additionalProperties: false
    PublicEvidenceItem:
      title: PublicEvidenceItem
      type: object
      properties:
        evidence_id:
          type: string
        knowledge_base_id:
          type:
            - string
            - "null"
        source_file_id:
          type:
            - string
            - "null"
        file_version_id:
          type:
            - string
            - "null"
        file_name:
          type:
            - string
            - "null"
        content:
          type: string
        score:
          type:
            - number
            - "null"
        similarity:
          type:
            - number
            - "null"
        weighted_score:
          type:
            - number
            - "null"
        page:
          type:
            - integer
            - "null"
        highlight:
          type:
            - string
            - "null"
        source_freshness:
          type:
            - string
            - "null"
        last_synced_at: true
      additionalProperties: false
      required:
        - evidence_id
    ApplicationRetrievalData:
      title: ApplicationRetrievalData
      type: object
      properties:
        application_id:
          type: string
        release_id:
          type: string
        channel:
          type: string
          enum:
            - preview
            - stable
        manifest_hash:
          type: string
        status:
          type: string
          enum:
            - success
            - empty
            - degraded
        answer_model:
